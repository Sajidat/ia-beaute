services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iabeaute}
      POSTGRES_USER: ${POSTGRES_USER:-iabeaute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iabeaute123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iabeaute} -d ${POSTGRES_DB:-iabeaute}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://iabeaute:iabeaute123@db:5432/iabeaute}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: